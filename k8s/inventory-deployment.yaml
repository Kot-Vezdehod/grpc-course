apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: grpc-inventory:v1
          imagePullPolicy: Never
          env:
            - name: INVENTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-db
                  key: INVENTORY_DATABASE_URL
          readinessProbe:
            tcpSocket:
              port: 50053
            periodSeconds: 5
          ports:
            - containerPort: 50053
